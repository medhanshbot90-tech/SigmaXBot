<!-- ========================= SMALLER & CLEAN UPDATED SigmaXBot ========================= -->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SigmaXBot</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

height:100vh;

background:
linear-gradient(
135deg,
#0b0f0c,
#10241a,
#1b4332,
#081c15
);

overflow:hidden;

color:white;
}

.container{
display:flex;
height:100vh;
}

/* ================= SIDEBAR ================= */

.sidebar{

width:220px;

background:
rgba(0,0,0,0.35);

backdrop-filter:blur(10px);

padding:12px;

border-right:
1px solid rgba(255,255,255,0.08);
}

/* ================= LOGO ================= */

.logo{

font-size:24px;

font-weight:bold;

text-align:center;

margin-bottom:16px;

background:
linear-gradient(
90deg,
#b8ffcf,
#8af5b2,
#d8ffe5
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

text-shadow:
0 0 8px #8af5b2;
}

/* ================= NEW CHAT ================= */

.newchat{

width:100%;

padding:11px;

border:none;

border-radius:12px;

background:
linear-gradient(
90deg,
#00c896,
#00ffcc
);

color:black;

font-weight:bold;

cursor:pointer;

margin-bottom:16px;

font-size:14px;
}

.history{
display:flex;
flex-direction:column;
gap:8px;
}

.history div{

background:
rgba(255,255,255,0.06);

padding:10px;

border-radius:10px;

cursor:pointer;

font-size:13px;

transition:0.3s;
}

/* ================= MAIN ================= */

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* ================= HERO ================= */

.hero{

text-align:center;

padding:14px;
}

.hero h1{

font-size:32px;

background:
linear-gradient(
90deg,
#00ffcc,
#00c3ff,
#8f00ff
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;
}

.hero p{
color:#ddd;
margin-top:6px;
font-size:14px;
}

/* ================= FEATURES ================= */

.features{

display:flex;

justify-content:center;

gap:8px;

flex-wrap:wrap;

margin-bottom:12px;
}

.feature{

padding:9px 14px;

border-radius:22px;

font-size:13px;

background:
rgba(255,255,255,0.06);

border:
1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(10px);
}

/* ================= CHAT CONTAINER ================= */

.chat-container{

width:94%;

margin:auto;

flex:1;

background:
rgba(0,0,0,0.30);

border-radius:20px;

overflow:hidden;

display:flex;

flex-direction:column;

border:
1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(12px);
}

/* ================= TOPBAR ================= */

.topbar{

height:68px;

background:
rgba(0,0,0,0.35);

display:flex;

justify-content:space-between;

align-items:center;

padding:0 16px;

border-bottom:
1px solid rgba(255,255,255,0.08);
}

.profile{
display:flex;
align-items:center;
gap:10px;
}

/* ================= AVATAR ================= */

.avatar{

width:48px;
height:48px;

border-radius:50%;

background:#0d0d0d;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

border:
2px solid #00ffcc;

box-shadow:
0 0 10px #00ffcc;
}

.logo-img{

width:100%;
height:100%;

object-fit:cover;

border-radius:50%;
}

.name{
font-size:17px;
font-weight:bold;
}

.status{

width:9px;
height:9px;

border-radius:50%;

background:lime;

margin-top:3px;

box-shadow:
0 0 8px lime;
}

.tools{
display:flex;
gap:8px;
}

.tool{

width:40px;
height:40px;

border-radius:12px;

display:flex;

align-items:center;

justify-content:center;

background:
rgba(255,255,255,0.08);

cursor:pointer;

font-size:18px;

transition:0.3s;
}

.active{

background:
linear-gradient(
135deg,
#00ffcc,
#00c896
);

color:black;
}

/* ================= CHATBOX ================= */

#chatbox{

flex:1;

overflow-y:auto;

padding:16px;

display:flex;

flex-direction:column;

gap:14px;
}

/* ================= MESSAGE ================= */

.msg{

max-width:72%;

padding:12px;

border-radius:16px;

line-height:1.4;

font-size:14px;

animation:fade 0.3s ease;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}
}

.bot{

align-self:flex-start;

background:
linear-gradient(
135deg,
rgba(0,255,204,0.20),
rgba(0,195,255,0.15)
);
}

.user{

align-self:flex-end;

background:
linear-gradient(
135deg,
rgba(143,0,255,0.25),
rgba(255,0,76,0.15)
);
}

.time{

font-size:10px;

opacity:0.6;

margin-top:5px;
}

/* ================= INPUT ================= */

.input-area{

display:flex;

align-items:center;

gap:10px;

padding:14px;

background:
rgba(0,0,0,0.35);
}

.input-box{

flex:1;

height:52px;

background:#111;

border-radius:15px;

display:flex;

align-items:center;

padding:0 14px;

position:relative;

transition:0.3s;
}

.input-box input{

flex:1;

background:transparent;

border:none;

outline:none;

color:white;

font-size:14px;
}

.send,
.mic{

width:40px;
height:40px;

border:none;

border-radius:15px;

background:
linear-gradient(
135deg,
#00ffcc,
#00c896
);

color:black;

font-size:18px;

cursor:pointer;

transition:0.3s;
}

.send:hover,
.mic:hover{
transform:scale(1.05);
}

/* ================= MIC EFFECT ================= */

.listening{

animation:
pulse 1.2s infinite;

box-shadow:
0 0 10px #00ffcc,
0 0 22px #00c896;
}

.listening::before{

content:"";

position:absolute;

top:-4px;
left:-4px;
right:-4px;
bottom:-4px;

border-radius:18px;

border:3px solid transparent;

border-top:
3px solid #00ffcc;

border-right:
3px solid #00c896;

animation:
rotateGlow 1s linear infinite;
}

@keyframes rotateGlow{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.01);
}

100%{
transform:scale(1);
}
}

</style>

</head>

<body>

<div class="container">

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

<div class="logo">
SigmaXBot ⚡
</div>

<button class="newchat" onclick="newChat()">
+ New Chat
</button>

<div class="history" id="history"></div>

</div>

<!-- ================= MAIN ================= -->

<div class="main">

<div class="hero">

<h1>
Meet SigmaXBot
</h1>

<p>
Your Coolest Smart AI Bot
</p>

</div>

<div class="features">

<div class="feature">🧠 Smart AI</div>
<div class="feature">🎤 Voice Input</div>
<div class="feature">🔊 Voice Output</div>
<div class="feature">🌐 Web Search</div>

</div>

<div class="chat-container">

<!-- ================= TOPBAR ================= -->

<div class="topbar">

<div class="profile">

<div class="avatar">

<img
src="logo.png"
class="logo-img"
>

</div>

<div>

<div class="name">
SigmaXBot
</div>

<div class="status"></div>

</div>

</div>

<div class="tools">

<div
class="tool"
id="webBtn"
onclick="toggleWeb()"
>
🌐
</div>

<div
class="tool"
id="voiceBtn"
onclick="toggleVoice()"
>
🔊
</div>

</div>

</div>

<!-- ================= CHAT ================= -->

<div id="chatbox">

<div class="msg bot">

🤖 Hi! I'm SigmaXBot 👋

<div class="time">
Online
</div>

</div>

</div>

<!-- ================= INPUT ================= -->

<div class="input-area">

<button class="mic" onclick="voiceInput()">
🎤
</button>

<div class="input-box" id="inputBox">

<input
id="input"
placeholder="Message SigmaXBot..."
>

</div>

<button class="send" onclick="send()">
➤
</button>

</div>

</div>

</div>

</div>

<script>

let webEnabled = false;

let voiceEnabled = false;

// ================= WEB TOGGLE =================

function toggleWeb(){

webEnabled = !webEnabled;

document
.getElementById("webBtn")
.classList.toggle("active");
}

// ================= VOICE TOGGLE =================

function toggleVoice(){

voiceEnabled = !voiceEnabled;

document
.getElementById("voiceBtn")
.classList.toggle("active");
}

// ================= SEND =================

async function send(customText=null){

const input =
document.getElementById("input");

let text =
customText || input.value;

if(!text.trim()) return;

addMessage(text,"user");

saveHistory(text);

input.value = "";

const res = await fetch("/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:text,
web:webEnabled
})
});

const data =
await res.json();

addMessage(data.reply,"bot");

if(voiceEnabled){
speak(data.reply);
}
}

// ================= MESSAGE =================

function addMessage(text,type){

const box =
document.getElementById("chatbox");

const div =
document.createElement("div");

div.className =
"msg " + type;

let icon =
type==="bot"
? "🤖 "
: "🧑 ";

div.innerHTML =
icon + text +
`<div class="time">
${new Date().toLocaleTimeString()}
</div>`;

box.appendChild(div);

box.scrollTop =
box.scrollHeight;
}

// ================= HISTORY =================

function saveHistory(text){

const history =
document.getElementById("history");

const item =
document.createElement("div");

item.innerText =
text.substring(0,30);

history.prepend(item);
}

// ================= RESET =================

async function newChat(){

document
.getElementById("chatbox")
.innerHTML = "";

await fetch("/reset",{
method:"POST"
});
}

// ================= ENTER =================

document
.getElementById("input")
.addEventListener("keydown",(e)=>{

if(e.key==="Enter"){
send();
}
});

// ================= VOICE OUTPUT =================

function speak(text){

window
.speechSynthesis
.cancel();

let speech =
new SpeechSynthesisUtterance(text);

speech.lang = "en-US";

speech.rate = 1;

window
.speechSynthesis
.speak(speech);
}

// ================= VOICE INPUT =================

function voiceInput(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

const recognition =
new SpeechRecognition();

const inputBox =
document.getElementById("inputBox");

recognition.lang = "en-US";

inputBox
.classList
.add("listening");

recognition.start();

recognition.onresult = (e)=>{

let text =
e.results[0][0].transcript;

send(text);
};

recognition.onend = ()=>{

inputBox
.classList
.remove("listening");
};

recognition.onerror = ()=>{

inputBox
.classList
.remove("listening");
};
}

</script>

</body>
</html>
